global:
  scrape_interval: 15s
  scrape_timeout: 4s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: tcc-committed
    static_configs:
      - targets: ['host.docker.internal:9464']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: containers-linux-vm
    static_configs:
      - targets: ['cadvisor:8080']
