global:
  scrape_interval: 1s
  evaluation_interval: 15s
  external_labels:
    monitor: 'batch-monitoring'


scrape_configs:
 
  # Scrape do Postgres Exporter
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s
    metrics_path: /metrics

  # Scrape do cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']